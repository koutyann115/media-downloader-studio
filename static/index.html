<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Downloader Studio — YouTube / X 動画・音声保存ツール</title>
  <link rel="icon" type="image/x-icon" href="/static/icon.ico" />
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <img src="/static/icon.png" alt="Media Downloader Studio Icon" />
        </div>
        <div>
          <h1>Media Downloader Studio</h1>
          <p class="subtitle">YouTube・X (Twitter)・TikTok・ニコニコ動画・SoundCloud 等から高画質動画＆高音質MP3を簡単保存</p>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge badge-ok" id="ffmpegStatusBadge">FFmpeg 準備完了</span>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-grid">
      <!-- Left Column: Input & Settings -->
      <section class="card config-card">
        <!-- Input Mode Switcher -->
        <div class="section-header">
          <label class="section-title">1. 動画・音声のURLを入力</label>
          <div class="mode-switch">
            <button type="button" class="mode-btn active" id="singleModeBtn" onclick="switchInputMode('single')">単体URL（プレビュー付）</button>
            <button type="button" class="mode-btn" id="batchModeBtn" onclick="switchInputMode('batch')">複数URL一括入力</button>
          </div>
        </div>

        <!-- Single URL Input -->
        <div id="singleInputBox" class="input-group">
          <div class="url-bar">
            <input
              type="text"
              id="urlInput"
              placeholder="https://www.youtube.com/watch?v=... または https://x.com/..."
              autocomplete="off"
            />
            <button type="button" class="btn btn-ghost" id="pasteBtn" title="クリップボードから貼り付け" onclick="pasteFromClipboard()">
              貼り付け
            </button>
            <button type="button" class="btn btn-secondary" id="analyzeBtn" onclick="analyzeUrl()">
              情報取得
            </button>
          </div>
          <div id="analyzeLoading" class="analyze-loading hidden">
            <span class="spinner"></span> 動画・音声の情報を取得しています...
          </div>

          <!-- Media Preview Card -->
          <div id="previewCard" class="preview-card hidden">
            <div class="preview-thumb-wrap">
              <img id="previewThumb" src="" alt="Thumbnail" />
              <span id="previewDuration" class="duration-badge">--:--</span>
              <span id="previewSite" class="site-badge">YouTube</span>
            </div>
            <div class="preview-info">
              <h3 id="previewTitle">動画タイトル</h3>
              <p id="previewUploader" class="preview-meta">チャンネル名</p>
              <div id="previewResBadges" class="res-badges"></div>
            </div>
          </div>
        </div>

        <!-- Batch URL Input -->
        <div id="batchInputBox" class="input-group hidden">
          <textarea
            id="batchUrlsInput"
            rows="4"
            placeholder="1行に1つずつURLを入力してください（YouTube・X等のURLをまとめて連続ダウンロードできます）&#10;https://www.youtube.com/watch?v=...&#10;https://x.com/.../status/..."
          ></textarea>
          <div class="batch-helper">
            <span id="batchCountLabel">0 件のURL</span>
            <button type="button" class="btn-link" onclick="pasteBatchClipboard()">クリップボードから追加</button>
          </div>
        </div>

        <hr class="divider" />

        <!-- Format & Quality -->
        <div class="section-header">
          <label class="section-title">2. 保存形式・画質 / 音質を選択</label>
        </div>

        <!-- Media Type Tabs (Video vs Audio) -->
        <div class="media-type-tabs">
          <button type="button" class="type-tab active" id="tabVideo" onclick="setMediaType('video')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <polygon points="10 9 15 12 10 15 10 9"/>
            </svg>
            動画として保存 (MP4 / WEBM / MKV)
          </button>
          <button type="button" class="type-tab" id="tabAudio" onclick="setMediaType('audio')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
            音声のみ抽出 (MP3 / M4A / WAV / FLAC)
          </button>
        </div>

        <div class="options-grid">
          <div class="form-field">
            <label for="containerSelect">ファイル形式 (拡張子)</label>
            <select id="containerSelect"></select>
          </div>
          <div class="form-field">
            <label for="qualitySelect" id="qualityLabel">画質 (解像度)</label>
            <select id="qualitySelect"></select>
          </div>
        </div>

        <hr class="divider" />

        <!-- Save Location -->
        <div class="section-header">
          <label class="section-title">3. 保存先フォルダ</label>
        </div>
        <div class="folder-bar">
          <input type="text" id="saveDirInput" placeholder="保存先フォルダのパス" />
          <button type="button" class="btn btn-secondary" onclick="pickSaveFolder()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            参照...
          </button>
          <button type="button" class="btn btn-ghost" title="現在の保存先フォルダを開く" onclick="openCurrentSaveFolder()">
            開く
          </button>
        </div>

        <!-- Advanced Options (Time Clipping, Custom Filename, Metadata) -->
        <details class="advanced-panel" id="advancedPanel">
          <summary>
            <span>✂️ 時間指定カット（切り抜き）・ファイル名指定・詳細オプション</span>
            <span class="summary-hint">クリックして展開</span>
          </summary>
          <div class="advanced-body">
            <div class="options-grid">
              <div class="form-field">
                <label for="startTimeInput">開始時間 (例: 01:20) <span class="opt-tag">任意</span></label>
                <input type="text" id="startTimeInput" placeholder="00:00 (空欄で最初から)" />
              </div>
              <div class="form-field">
                <label for="endTimeInput">終了時間 (例: 03:45) <span class="opt-tag">任意</span></label>
                <input type="text" id="endTimeInput" placeholder="空欄で最後まで" />
              </div>
            </div>
            <div class="form-field" style="margin-top: 10px;">
              <label for="customFilenameInput">カスタムファイル名 <span class="opt-tag">任意・空欄なら動画タイトル</span></label>
              <input type="text" id="customFilenameInput" placeholder="例: お気に入り動画_01 (拡張子は自動で付きます)" />
            </div>
            <div class="checkbox-row">
              <label class="checkbox-label">
                <input type="checkbox" id="embedThumbCheck" />
                <span>サムネイル画像をファイルに埋め込む</span>
              </label>
              <label class="checkbox-label" id="embedSubsLabel">
                <input type="checkbox" id="embedSubsCheck" />
                <span>字幕があれば動画に埋め込む</span>
              </label>
            </div>
          </div>
        </details>

        <!-- Submit Button -->
        <button type="button" class="btn btn-primary btn-download" id="downloadBtn" onclick="startDownload()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="downloadBtnText">ダウンロード開始</span>
        </button>
      </section>

      <!-- Right Column: Live Progress Queue & History -->
      <section class="card queue-card">
        <div class="queue-header">
          <div class="queue-tabs">
            <button type="button" class="q-tab active" id="tabActiveQueue" onclick="switchRightTab('queue')">
              進行状況・キュー <span class="count-pill" id="activeCountPill">0</span>
            </button>
            <button type="button" class="q-tab" id="tabHistory" onclick="switchRightTab('history')">
              保存済み履歴 <span class="count-pill" id="historyCountPill">0</span>
            </button>
          </div>
          <div class="queue-actions">
            <button type="button" class="btn-small" id="clearQueueBtn" onclick="clearFinishedTasks()">完了済みを整理</button>
            <button type="button" class="btn-small hidden" id="clearHistoryBtn" onclick="clearAllHistory()">履歴をクリア</button>
          </div>
        </div>

        <!-- Active Queue List -->
        <div id="queueListContainer" class="task-list">
          <div class="empty-state">
            <p>現在進行中のタスクはありません</p>
            <span>URLを入力して「ダウンロード開始」を押すと、ここにリアルタイムの進捗バー・速度・残り時間が表示されます。</span>
          </div>
        </div>

        <!-- History List -->
        <div id="historyListContainer" class="task-list hidden">
          <div class="empty-state">
            <p>まだダウンロード履歴がありません</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
